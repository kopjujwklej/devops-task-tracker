server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prosty health endpoint, niezależny od plików statycznych —
    # żeby Docker/Kubernetes mógł sprawdzić, czy nginx w ogóle odpowiada.
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
